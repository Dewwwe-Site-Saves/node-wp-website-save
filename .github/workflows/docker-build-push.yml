name: Build and push Docker image

# main -> :staging, version tags -> :latest and :X.Y.Z, pull requests build without pushing.
# workflow_dispatch from any branch pushes a :<branch> tag, to try an image on the NAS before tagging. GitHub only offers the manual run for workflows present on the default branch, so until v2 is merged every push to v2 builds :v2 as well. Remove v2 from the list after the merge.
on:
    push:
        branches: [main, v2]
        tags: ['v*.*.*']
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Patch package.json version from tag
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  VERSION=${GITHUB_REF_NAME#v}
                  echo "Patching package.json with version: $VERSION"
                  jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
                  mv package.json.tmp package.json

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
                      type=semver,pattern={{version}}
                      type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v2' }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
