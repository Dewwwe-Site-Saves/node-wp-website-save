# Reposite as a Portainer stack in Repository mode (compose path: docker-compose.yml, branch: main).
# Everything host-specific comes from the stack's environment variables, never from this file:
#   ENCRYPTION_KEY, SESSION_SECRET  openssl rand -hex 32 each
#   REPOSITE_DATA                   host directory mounted on /data (database, clones, certificate), writable by PUID:PGID
#   REPOSITE_SUBNET                 a free /29 for the stack network
#   REPOSITE_PORT, PUID, PGID, TZ   optional, see the defaults below
#   REPOSITE_TAG                    image tag: unset for :latest (releases), a branch name to try a pre-release build
# Updates are manual: Stack > Editor > Pull and redeploy. The image only moves on version tags (see .github/workflows/docker-build-push.yml).

services:
    reposite:
        image: ghcr.io/dewwwe-site-saves/reposite:${REPOSITE_TAG:-latest}
        container_name: Reposite-App
        restart: unless-stopped
        ports:
            - '${REPOSITE_PORT:-3000}:3000'
        environment:
            - DATA_DIR=/data
            - TZ=${TZ:-Europe/Paris}
            - PUID=${PUID:-1000}
            - PGID=${PGID:-1000}
            - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in the stack environment}
            - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in the stack environment}
            - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
        volumes:
            - ${REPOSITE_DATA:?set REPOSITE_DATA to the host data directory}:/data
        networks:
            - reposite-net
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://127.0.0.1:3000/api/health', (r) => { r.resume(); process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

networks:
    reposite-net:
        driver: bridge
        ipam:
            config:
                - subnet: ${REPOSITE_SUBNET:?set REPOSITE_SUBNET to a free /29}
